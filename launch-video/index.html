<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f4f4f5; }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      h1 { font-size: 120px; font-weight: 700; letter-spacing: -0.03em; }
      h2 { font-size: 56px; font-weight: 500; color: #a5b4fc; }
      .sub { font-size: 36px; color: #94a3b8; }
      .pill { padding: 12px 28px; border: 1px solid #334155; border-radius: 999px; font-size: 28px; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="scene clip" id="s1" data-start="0" data-duration="4" data-track-index="0">
        <h1>Awesome World Models</h1>
        <div class="sub">A curated list of world models</div>
      </div>
      <div class="scene clip" id="s2" data-start="4" data-duration="4" data-track-index="1">
        <h2>Papers · Models · Datasets</h2>
        <div class="sub">Benchmarks · Tools · Tutorials</div>
      </div>
      <div class="scene clip" id="s3" data-start="8" data-duration="4" data-track-index="2">
        <h2>Video · 3D · Driving</h2>
        <div class="sub">Robotics · Game · Interactive</div>
      </div>
      <div class="scene clip" id="s4" data-start="12" data-duration="3" data-track-index="3">
        <h1>Explore &amp; Contribute</h1>
        <div class="pill">github.com/rajasekharponakala/awesome-world-models</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 0);
      tl.to("#s1", { opacity: 0, duration: 0.6 }, 3.2);
      tl.fromTo("#s2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 4);
      tl.to("#s2", { opacity: 0, duration: 0.6 }, 7.2);
      tl.fromTo("#s3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 8);
      tl.to("#s3", { opacity: 0, duration: 0.6 }, 11.2);
      tl.fromTo("#s4", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.8 }, 12);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
